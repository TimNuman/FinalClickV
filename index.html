<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05060a" />
    <title>FINAL CLICK</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="renderCanvas" touch-action="none"></canvas>

    <!-- HUD overlay -->
    <div id="hud">
      <!-- Top bar: level + XP -->
      <div class="hud-top">
        <div class="level-badge">
          <div class="level-label">LVL</div>
          <div class="level-number" id="levelNumber">1</div>
        </div>
        <div class="xp-wrap">
          <div class="xp-row">
            <span id="rankTitle">Apprentice Clicker</span>
            <span id="xpText">0 / 100 XP</span>
          </div>
          <div class="xp-bar">
            <div class="xp-fill" id="xpFill"></div>
            <div class="xp-shine"></div>
          </div>
        </div>
      </div>

      <!-- Streak meter (right) -->
      <div class="streak-wrap">
        <div class="streak-label">STREAK</div>
        <div class="streak-number" id="streakNumber">0</div>
        <div class="streak-bar">
          <div class="streak-fill" id="streakFill"></div>
        </div>
        <div class="streak-tier" id="streakTier">—</div>
      </div>

      <!-- Stats (left) -->
      <div class="stats-wrap">
        <div class="stat-row"><span>Score</span><span id="scoreText">0</span></div>
        <div class="stat-row"><span>Best Streak</span><span id="bestStreakText">0</span></div>
        <div class="stat-row"><span>Clicks</span><span id="clicksText">0</span></div>
        <div class="stat-row"><span>Crit Chance</span><span id="critText">5%</span></div>
      </div>

      <!-- Recovery bar (bottom center) -->
      <div class="recovery-wrap" id="recoveryWrap">
        <div class="recovery-label" id="recoveryLabel">CHARGING</div>
        <div class="recovery-bar">
          <div class="recovery-fill" id="recoveryFill"></div>
        </div>
      </div>

      <!-- Center floating hit text -->
      <div id="hitTextLayer"></div>

      <!-- Vignette / flash overlay -->
      <div id="flashOverlay"></div>
    </div>

    <!-- Start screen — overlays the scene until the player hits Start -->
    <div id="startScreen">
      <div class="logo-stage">
        <div class="big-v" aria-hidden="true">V</div>
        <h1 class="logo-text">
          <span class="word">FINAL</span>
          <span class="word">CLICK</span>
        </h1>
      </div>
      <p class="logo-tagline">Click the button. Climb the levels. Get the shine.</p>
      <button id="startButton" class="start-button" type="button">START</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
