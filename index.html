<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05060a" />
    <title>FINAL CLICK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="renderCanvas" touch-action="none"></canvas>

    <!-- Background music. File lives in the repo root next to index.html;
         Vite's `base: '/FinalClickV/'` prepends the deploy prefix at build. -->
    <audio id="bgmAudio" src="Mythic Ironlight.mp3" preload="auto" loop></audio>

    <!-- HUD overlay -->
    <div id="hud">
      <!-- Top bar: level + XP -->
      <div class="hud-top">
        <div class="level-badge">
          <div class="level-label">LVL</div>
          <div class="level-number" id="levelNumber">1</div>
        </div>
        <div class="xp-wrap">
          <div class="xp-row">
            <span id="rankTitle">Apprentice Clicker</span>
            <span id="xpText">0 / 100 XP</span>
          </div>
          <div class="xp-bar">
            <div class="xp-fill" id="xpFill"></div>
            <div class="xp-shine"></div>
          </div>
        </div>
      </div>

      <!-- Streak meter (right) -->
      <div class="streak-wrap">
        <div class="streak-label">STREAK</div>
        <div class="streak-number" id="streakNumber">0</div>
        <div class="streak-bar">
          <div class="streak-fill" id="streakFill"></div>
        </div>
        <div class="streak-tier" id="streakTier">—</div>
        <!-- Floating element-chance row below the streak panel (no own background) -->
        <div class="streak-elements">
          <span class="elem-cell fire" title="Fire chance per hit">
            <svg class="elem-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 1 C 10 4 12 6 11 9 C 13 7 13 10 12 13 C 11 14.5 9.5 15 8 15 C 5 15 3 13 3 10 C 3 8 5 7 6 6 C 6 4 7 2.5 8 1 Z" fill="currentColor"/>
            </svg>
            <span id="fireChanceText">0.3%</span>
          </span>
          <span class="elem-cell lightning" title="Lightning chance per hit">
            <svg class="elem-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M9 1 L 3 9 L 7 9 L 5 15 L 13 6 L 9 6 L 11 1 Z" fill="currentColor"/>
            </svg>
            <span id="lightningChanceText">0.3%</span>
          </span>
          <span class="elem-cell magic" title="Magic chance per hit">
            <svg class="elem-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 0 L 9.2 6.8 L 16 8 L 9.2 9.2 L 8 16 L 6.8 9.2 L 0 8 L 6.8 6.8 Z" fill="currentColor"/>
            </svg>
            <span id="magicChanceText">0.3%</span>
          </span>
        </div>
      </div>

      <!-- Stats (left) -->
      <div class="stats-wrap">
        <div class="stat-row"><span>Score</span><span id="scoreText">0</span></div>
        <div class="stat-row"><span>Best Streak</span><span id="bestStreakText">0</span></div>
        <div class="stat-row"><span>Clicks</span><span id="clicksText">0</span></div>
        <div class="stat-row"><span>Crit Chance</span><span id="critText">5%</span></div>
      </div>

      <!-- Recovery bar (bottom center) -->
      <div class="recovery-wrap" id="recoveryWrap">
        <div class="recovery-label" id="recoveryLabel">CHARGING</div>
        <div class="recovery-bar">
          <div class="recovery-fill" id="recoveryFill"></div>
        </div>
      </div>

      <!-- Diagonal slash flashes — fired on each hit, scales with category -->
      <div id="slashLayer"></div>

      <!-- Center floating hit text -->
      <div id="hitTextLayer"></div>

      <!-- Vignette / flash overlay -->
      <div id="flashOverlay"></div>
    </div>

    <!-- Start screen — overlays the scene until the player hits Start -->
    <div id="startScreen">
      <div class="logo-stage">
        <div class="big-v" aria-hidden="true">V</div>
        <h1 class="logo-text">
          <span class="word">Final</span>
          <span class="word">Click</span>
        </h1>
      </div>
      <button id="startButton" class="start-button" type="button">START</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
